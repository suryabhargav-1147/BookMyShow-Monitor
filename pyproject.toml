[project]
name = "bms-monitor"
version = "0.1.0"
description = "Watch BookMyShow for ticket openings; alert via Telegram, ntfy and a dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "playwright>=1.65.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
bms-monitor = "app.main:run"
bms-mcp = "app.mcp_server:main"
bms-check = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
