# nginx site for BMS Monitor: /etc/nginx/sites-available/bms.viswa2k.in.conf
# Installed by deploy/server-root.sh. Same pattern as redbus.viswa2k.in: Cloudflare (SSL mode
# Flexible) connects to this server on port 80; the app runs in Docker on 127.0.0.1:30030.
server {
    listen 80;
    listen [::]:80;
    server_name bms.viswa2k.in;

    # Sign-in is in the app: only the allowed Telegram user IDs get a login code. nginx only forwards.

    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 1m;

    location / {
        proxy_pass         http://127.0.0.1:30030;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # Live dashboard updates are a server-sent event stream: pass them on as they arrive.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
        proxy_send_timeout 120s;
    }
}
