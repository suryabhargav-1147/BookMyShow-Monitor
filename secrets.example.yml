# Copy to secrets.yml (gitignored), fill in, then run:
#   uv run python scripts/push_secrets.py
# Each non-empty value becomes a GitHub Actions secret on this repo.

# From @BotFather (/newbot). Looks like 123456789:AAH...xyz
telegram_bot_token: ""

# Who gets alerts. Each person must first send /start to your bot.
# Find your ID by messaging @userinfobot. Several IDs: comma-separated.
telegram_user_ids: ""

# Optional: ntfy topic (already set; leave empty to keep the current one)
ntfy_topic: ""
