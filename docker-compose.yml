# BMS Monitor on the VPS (~/apps/bms-monitor). Deployed by deploy/setup-server.sh.
services:
  bms-monitor:
    build: .
    image: bms-monitor:latest
    container_name: bms-monitor
    restart: unless-stopped
    user: "1000:1000"            # the server user (viswa2k): owns ./data
    ports:
      - "127.0.0.1:30030:8642"   # local only: nginx (port 80) is the way in
    env_file:
      - path: .env                # Telegram token/IDs, session secret (server only, never in git)
        required: false
    environment:
      BMS_PUBLIC_URL: https://bms.viswa2k.in
    volumes:
      - ./data:/data              # watches, settings, activity log
    mem_limit: 384m
